# Развёртывание на одном сервере (ADR-0008, DV-014): docker compose up -d
# Caddy и веб-клиент подключаются в итерации 3 вместе с интерфейсом (F-06).
name: steam-deal-hunter

x-app: &app
  image: steam-deal-hunter:${VERSION:-dev}
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-shopper}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shopper}?sslmode=disable

services:
  api:
    <<: *app
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    entrypoint: ["/usr/local/bin/worker"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started   # миграции применяет api

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-shopper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-shopper}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-shopper}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh", "--loop"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
