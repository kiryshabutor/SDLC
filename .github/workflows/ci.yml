# Непрерывная интеграция (REQ-BUILD-002): проверка каждого pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: go test
        env:
          TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage of domain logic (REQ-MAINT-003, >= 70 %)
        run: |
          go test -coverprofile=domain.out ./internal/domain/
          go tool cover -func=domain.out | awk '/^total:/ { sub("%", "", $3); print "domain coverage: " $3 "%"; exit ($3 < 70) }'

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t steam-deal-hunter:ci .
      - name: compose config
        run: cp .env.example .env && docker compose config -q
